# Tenant routing: /<tenant>/... is forwarded to that tenant's HAPI instance with the prefix stripped.

client_max_body_size 50m;

server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    location /reddys/ {
        proxy_pass http://hapi-reddys:8080/;
    }

    location /apollo/ {
        proxy_pass http://hapi-apollo:8080/;
    }

    # Anything without a known tenant prefix is rejected
    location / {
        default_type application/json;
        return 404 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"not-found","diagnostics":"Unknown tenant. Use /reddys/fhir or /apollo/fhir"}]}';
    }
}
