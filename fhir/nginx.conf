# Tenant routing: /<tenant>/... is forwarded to that tenant's HAPI instance with the prefix stripped.
# Authentication: every request is first checked by fhir-auth (auth/validator.py) - a WSO2 IS access token of that tenant with
# fhir.read (GET/HEAD) or fhir.write (other methods). Only then is it forwarded to HAPI.

client_max_body_size 50m;

server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    # Token check (internal subrequest): only the headers go to fhir-auth, never the body.
    location = /_auth {
        internal;
        proxy_pass http://fhir-auth:8000/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    location /reddys/ {
        auth_request /_auth;
        auth_request_set $auth_error $upstream_http_x_auth_error;
        auth_request_set $auth_challenge $upstream_http_www_authenticate;
        proxy_pass http://hapi-reddys:8080/;
    }

    location /apollo/ {
        auth_request /_auth;
        auth_request_set $auth_error $upstream_http_x_auth_error;
        auth_request_set $auth_challenge $upstream_http_www_authenticate;
        proxy_pass http://hapi-apollo:8080/;
    }

    # Refusals from the token check, as FHIR OperationOutcomes.
    error_page 401 = @unauthorized;
    error_page 403 = @forbidden;

    location @unauthorized {
        default_type application/fhir+json;
        add_header WWW-Authenticate $auth_challenge always;
        return 401 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"login","diagnostics":"$auth_error"}]}';
    }

    location @forbidden {
        default_type application/fhir+json;
        add_header WWW-Authenticate $auth_challenge always;
        return 403 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"forbidden","diagnostics":"$auth_error"}]}';
    }

    # Anything without a known tenant prefix is rejected
    location / {
        default_type application/json;
        return 404 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"not-found","diagnostics":"Unknown tenant. Use /reddys/fhir or /apollo/fhir"}]}';
    }
}
