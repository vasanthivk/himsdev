# Multi-tenant HAPI FHIR: one HAPI instance per tenant, each with its own PostgreSQL database,
# behind an nginx gateway:
#   http://<host>:8080/reddys/fhir   -> hapi-reddys -> hims_fhir_reddys
#   http://<host>:8080/apollo/fhir   -> hapi-apollo -> hims_fhir_apollo

x-hapi-common: &hapi-common
  image: ${HAPI_IMAGE}
  restart: unless-stopped
  networks: [fhir]
  # HAPI instances are not published directly; only the gateway is exposed.

x-hapi-env: &hapi-env
  SPRING_DATASOURCE_USERNAME: ${DB_USER}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "20"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
  SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_ENABLED: "false"
  HAPI_FHIR_FHIR_VERSION: R4
  HAPI_FHIR_TESTER_HOME_FHIR_VERSION: R4

services:
  hapi-reddys:
    <<: *hapi-common
    container_name: hapi-reddys
    environment:
      <<: *hapi-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${REDDYS_DB}
      HAPI_FHIR_SERVER_ADDRESS: ${PUBLIC_BASE_URL}/reddys/fhir/
      HAPI_FHIR_TESTER_HOME_SERVER_ADDRESS: ${PUBLIC_BASE_URL}/reddys/fhir/
      HAPI_FHIR_TESTER_HOME_NAME: Reddys

  hapi-apollo:
    <<: *hapi-common
    container_name: hapi-apollo
    environment:
      <<: *hapi-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${APOLLO_DB}
      HAPI_FHIR_SERVER_ADDRESS: ${PUBLIC_BASE_URL}/apollo/fhir/
      HAPI_FHIR_TESTER_HOME_SERVER_ADDRESS: ${PUBLIC_BASE_URL}/apollo/fhir/
      HAPI_FHIR_TESTER_HOME_NAME: Apollo

  gateway:
    image: nginx:1.27-alpine
    container_name: fhir-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [hapi-reddys, hapi-apollo]
    networks: [fhir]

networks:
  fhir:
