# docker compose up --build
# PostgreSQL + RabbitMQ are included so the stack is self-contained. You already run RabbitMQ / HAPI-FHIR / Open Integration Engine on a
# server: delete the `rabbitmq` service and set RABBITMQ_HOST (and HAPI_FHIR_URL, ENGINE_URL) in a .env file instead.
name: hims

x-dotnet-env: &dotnet-env
  RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
  RabbitMq__User: ${RABBITMQ_USER:-guest}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}

x-dotnet-service: &dotnet-service
  depends_on:
    db-init: { condition: service_completed_successfully }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: hims, POSTGRES_PASSWORD: hims, POSTGRES_DB: postgres }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U hims"], interval: 5s, timeout: 3s, retries: 20 }

  db-init:      # runs database/deploy.sh: original scripts + extensions + seed, one database per microservice
    image: postgres:16
    depends_on: { postgres: { condition: service_healthy } }
    volumes: ["./database:/database:ro"]
    environment: { PGHOST: postgres, PGUSER: hims, PGPASSWORD: hims }
    entrypoint: ["bash", "/database/deploy.sh"]
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]

  identity-org:
    <<: *dotnet-service
    build: { context: ., dockerfile: services/identity-org/Dockerfile }
    environment: { <<: *dotnet-env, ConnectionStrings__Default: "Host=postgres;Database=hims_identity_org;Username=hims;Password=xv7o4aPKUqR6oEf5" }
    ports: ["5010:8080"]

  patient-access:
    <<: *dotnet-service
    build: { context: ., dockerfile: services/patient-access/Dockerfile }
    environment: { <<: *dotnet-env, ConnectionStrings__Default: "Host=postgres;Database=hims_patient_access;Username=hims;Password=xv7o4aPKUqR6oEf5" }
    ports: ["5001:8080"]

  clinical-care:
    <<: *dotnet-service
    build: { context: ., dockerfile: services/clinical-care/Dockerfile }
    environment: { <<: *dotnet-env, ConnectionStrings__Default: "Host=postgres;Database=hims_clinical_care;Username=hims;Password=xv7o4aPKUqR6oEf5" }
    ports: ["5002:8080"]

  laboratory:
    <<: *dotnet-service
    build: { context: ., dockerfile: services/laboratory/Dockerfile }
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: "Host=postgres;Database=hims_laboratory;Username=hims;Password=xv7o4aPKUqR6oEf5"
      IntegrationHub__BaseUrl: "http://integration:5011/"
    ports: ["5003:8080"]

  revenue-cycle:
    <<: *dotnet-service
    build: { context: ., dockerfile: services/revenue-cycle/Dockerfile }
    environment: { <<: *dotnet-env, ConnectionStrings__Default: "Host=postgres;Database=hims_revenue_cycle;Username=hims;Password=xv7o4aPKUqR6oEf5" }
    ports: ["5006:8080"]

  integration:   # Python
    build: { context: services/integration }
    depends_on: { db-init: { condition: service_completed_successfully } }
    environment:
      DATABASE_URL: postgresql://hims:hims@postgres:5432/hims_integration
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@${RABBITMQ_HOST:-rabbitmq}:5672/%2F
      HAPI_FHIR_URL: ${HAPI_FHIR_URL:-http://103.169.179.22:50060/fhir}
      RABBITMQ_API_URL: ${RABBITMQ_API_URL:-http://${RABBITMQ_HOST:-rabbitmq}:15672}   # as the Open Integration Engine reaches it
      ENGINE_URL: ${ENGINE_URL:-}
      ENGINE_USER: ${ENGINE_USER:-admin}
      ENGINE_PASSWORD: ${ENGINE_PASSWORD:-admin}
      HUB_PUBLIC_URL: http://integration:5011
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["5011:5011"]
    restart: unless-stopped

  patient-access-frontend:
    build: { context: frontend, dockerfile: Dockerfile, args: { ZONE: patient-access-frontend } }
    ports: ["3001:3001"]
  clinical-care-frontend:
    build: { context: frontend, dockerfile: Dockerfile, args: { ZONE: clinical-care-frontend } }
    ports: ["3002:3002"]
  laboratory-frontend:
    build: { context: frontend, dockerfile: Dockerfile, args: { ZONE: laboratory-frontend } }
    ports: ["3003:3003"]
  revenue-cycle-frontend:
    build: { context: frontend, dockerfile: Dockerfile, args: { ZONE: revenue-cycle-frontend } }
    ports: ["3006:3006"]
  shell:          # public entry point: http://localhost:3000
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        ZONE: shell
        PATIENT_ACCESS_ZONE_URL: http://patient-access-frontend:3001
        CLINICAL_CARE_ZONE_URL: http://clinical-care-frontend:3002
        LABORATORY_ZONE_URL: http://laboratory-frontend:3003
        REVENUE_CYCLE_ZONE_URL: http://revenue-cycle-frontend:3006
    ports: ["3000:3000"]
    depends_on: [patient-access-frontend, clinical-care-frontend, laboratory-frontend, revenue-cycle-frontend]

volumes:
  pgdata:
